<!DOCTYPE html>
<html lang="ja">
<head>
    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>シネマティック・ビューワー</title>
        <!-- フォント読み込み -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    
        <!-- スタイルシート -->
        <link rel="stylesheet" href="css/story_style.css">
    
        <!-- Markdownパーサー -->
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>
    <body>
        <!-- 画面全体を覆うスクリーン -->
        <div id="screen" class="screen">
        
            <!-- 背景レイヤー（画像/動画） -->
            <div id="background-container">
                <!-- ここに動的に img や video が入ります -->
            </div>

            <!-- 字幕エリア -->
            <div id="subtitle-box" class="subtitle-box hidden">
                <p id="subtitle-text"></p>
                <span class="next-indicator">▼</span>
            </div>

            <!-- 開始オーバーレイ -->
            <div id="start-overlay" class="overlay">
                <div class="start-content">
                    <h1>1gの境界線</h1>
                    <p>タップして再生を開始</p>
                    <p class="note">※音声が流れます</p>
                </div>
            </div>

            <!-- コントローラー（マウスホバーで表示） -->
            <div class="controls">
                <a href="index.html" class="control-btn">✕ 終了</a>
                <button id="auto-btn" class="control-btn">▶ Auto</button>
                <button id="log-btn" class="control-btn">📝 ログ</button>
            </div>
        </div>

        <!-- BGM -->
        <audio id="bgm" loop></audio>

        <!-- 音声マップ（生成済み） -->
        <script src="assets/voice_map.js"></script>
        <!-- スクリプト -->
        <script src="js/story_reader.js"></script>
    </body>
    </html>
