<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1gの境界線 - The 1g Border</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;700&family=Noto+Sans+JP:wght@300;400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
    <style>
        /* ベーススタイル */
        :root {
            --primary-color: #fff;
            --accent-color: #ffab91; /* キッチンカーの暖色イメージ */
            --text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Zen Maru Gothic', 'Noto Sans JP', sans-serif;
            background-color: #333;
            color: var(--primary-color);
        }

        /* 背景画像レイヤー */
        .bg-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* アニメ調のキッチンカー背景を指定 */
            background-image: url('assets/bg_foodtruck_anime.jpg');
            background-size: cover;
            background-position: center;
            opacity: 0.9; /* 明るく表示 */
            z-index: -1;
            transition: transform 10s ease-out; /* ゆっくりズームアウト演出 */
            transform: scale(1.1);
        }
        
        body.loaded .bg-layer {
            transform: scale(1.0);
        }

        /* コンテナ */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            position: relative;
            z-index: 10;
            background: rgba(0, 0, 0, 0.2); /* 全体を少し暗くして文字を見やすく */
            backdrop-filter: blur(2px);
        }

        /* メインロゴエリア */
        .main-logo-area {
            margin-bottom: 3rem;
            animation: slideDown 1.5s ease forwards;
        }

        .main-title {
            font-family: 'Shippori Mincho', serif;
            font-size: 5rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.1em;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2), 0 0 30px rgba(255, 171, 145, 0.6);
            color: #fff;
        }

        .subtitle {
            font-family: 'Shippori Mincho', serif;
            font-size: 1.5rem;
            margin-top: 0.5rem;
            letter-spacing: 0.2em;
            opacity: 0.9;
            text-shadow: var(--text-shadow);
            border-top: 1px solid rgba(255,255,255,0.5);
            display: inline-block;
            padding-top: 0.5rem;
            padding-left: 1rem;
            padding-right: 1rem;
        }

        /* メインアクション（予告編再生ボタン） */
        .play-btn-wrapper {
            margin-bottom: 2rem;
            opacity: 0;
            animation: fadeIn 1s ease 1s forwards;
        }

        .play-trailer-btn {
            background: rgba(255, 171, 145, 0.9);
            color: #fff;
            border: none;
            padding: 1rem 3rem;
            font-size: 1.5rem;
            font-family: 'Zen Maru Gothic', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .play-trailer-btn:hover {
            transform: translateY(-3px) scale(1.05);
            background: #ff8a65;
            box-shadow: 0 15px 30px rgba(255, 138, 101, 0.4);
        }

        .play-icon {
            font-size: 1.2rem;
        }

        /* サブメニュー（台本を読むなど） */
        .sub-menu {
            display: flex;
            gap: 20px;
            opacity: 0;
            animation: fadeIn 1s ease 1.5s forwards;
        }

        .sub-link {
            color: rgba(255,255,255,0.8);
            text-decoration: none;
            font-size: 0.9rem;
            border-bottom: 1px solid transparent;
            transition: all 0.3s;
            background: rgba(0,0,0,0.4);
            padding: 0.5rem 1rem;
            border-radius: 4px;
        }

        .sub-link:hover {
            color: #fff;
            background: rgba(0,0,0,0.6);
            border-bottom-color: #fff;
        }

        /* 動画プレイヤーモーダル */
        .video-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s;
        }
        .video-modal-overlay.active { opacity: 1; visibility: visible; }
        
        .video-container {
            width: 90%;
            max-width: 1280px;
            aspect-ratio: 16 / 9;
            background: #000;
            box-shadow: 0 0 50px rgba(255, 171, 145, 0.3);
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .close-video-btn {
            position: absolute;
            top: -50px;
            right: 0;
            color: #fff;
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 5px 15px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 30px;
            transition: all 0.3s;
        }
        .close-video-btn:hover { background: rgba(255,255,255,0.2); }

        /* アニメーション定義 */
        @keyframes slideDown { from { transform: translateY(-30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* モバイル対応 */
        @media (max-width: 600px) {
            .main-title { font-size: 3rem; }
            .play-trailer-btn { padding: 0.8rem 2rem; font-size: 1.2rem; }
        }
    </style>
</head>
<body onload="document.body.classList.add('loaded')">
    
    <!-- 背景画像レイヤー -->
    <div class="bg-layer"></div>
    
    <!-- BGM (OPテーマ: Borderline of 1g) -->
    <audio id="bgm" loop>
        <source src="assets/op_theme_1g.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- 1. メインロゴエリア -->
        <div class="main-logo-area">
            <h1 class="main-title">1gの境界線</h1>
            <p class="subtitle">The 1g Border</p>
        </div>

        <!-- 2. メインアクション -->
        <div class="play-btn-wrapper">
            <button class="play-trailer-btn" onclick="playTrailer()">
                <span class="play-icon">▶</span> 予告編 再生
            </button>
        </div>

        <!-- 3. サブメニュー -->
        <div class="sub-menu">
            <!-- 台本を読む -->
            <a href="reader.html?file=sequel/script_1g_borderline.md" class="sub-link">📖 台本を読む</a>
            <!-- 前作に戻る -->
            <a href="reader.html?file=story_ch1.md" class="sub-link">↩ 前作『硝子の箱』へ</a>
        </div>
    </div>

    <!-- 動画プレイヤーモーダル -->
    <div id="video-modal" class="video-modal-overlay">
        <div class="video-container">
            <button class="close-video-btn" onclick="closeTrailer()">✕ 閉じる</button>
            <video id="trailer-video" controls>
                <!-- 予告編動画ファイル -->
                <source src="1g_borderline_subtitled.mp4" type="video/mp4">
                お使いのブラウザは動画タグに対応していません。
            </video>
        </div>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const videoModal = document.getElementById('video-modal');
        const trailerVideo = document.getElementById('trailer-video');
        let hasInteracted = false;

        // ページクリック時にBGM再生開始（ブラウザ制限対策）
        document.body.addEventListener('click', () => {
            if (!hasInteracted && !videoModal.classList.contains('active')) {
                bgm.volume = 0.3;
                bgm.play().catch(e => console.log("Audio play failed:", e));
                hasInteracted = true;
            }
        });

        // 予告編再生
        function playTrailer() {
            bgm.pause(); // BGMを止める
            videoModal.classList.add('active');
            trailerVideo.currentTime = 0;
            trailerVideo.play();
        }

        // 予告編終了
        function closeTrailer() {
            trailerVideo.pause();
            videoModal.classList.remove('active');
            if(hasInteracted) bgm.play(); // BGM再開
        }
    </script>
</body>
</html>
